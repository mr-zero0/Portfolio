<script>
/* set the time-of-day theme before first paint to avoid a flash */
(function(){
  var t = null;
  try { t = localStorage.getItem('tod-theme'); } catch (e) {}
  if (!t || ['day','evening','night','rainy'].indexOf(t) < 0) {
    var h = new Date().getHours(); t = h >= 5 && h < 17 ? 'day' : h < 20 ? 'evening' : 'night';
  }
  document.documentElement.dataset.theme = t;
  var bars = { day: '#ffffff', evening: '#3b2149', night: '#0a0a0a', rainy: '#0d1218' };
  document.addEventListener('DOMContentLoaded', function () {
    var c = bars[t];
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', c);
  });
})();
</script>
